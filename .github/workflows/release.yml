name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Validate release tag
        id: release
        run: node scripts/release-metadata.mjs
      - name: Require the release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run verify
      - run: npm install --global "npm@^11.15.0"
      - run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
      - name: Verify the published dist-tag
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          expected_version="${{ steps.release.outputs.version }}"
          npm_tag="${{ steps.release.outputs.npm_tag }}"
          for attempt in {1..12}; do
            actual_version="$(npm view "${package_name}@${npm_tag}" version 2>/dev/null || true)"
            if [[ "${actual_version}" == "${expected_version}" ]]; then exit 0; fi
            sleep 5
          done
          exit 1
